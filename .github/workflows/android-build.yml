name: GEO-PANEL Mobile — Compilación y Empaquetado APK

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Build-Tools y Plataformas Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Conceder permisos de ejecución a gradlew
        run: chmod +x android/gradlew || true

      - name: Compilar APK de Depuración con Gradle
        working-directory: ./android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Subir artefacto APK de Depuración
        uses: actions/upload-artifact@v4
        with:
          name: geopanel-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
